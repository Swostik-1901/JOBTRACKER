{% extends "tracker/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<h1>Login</h1>
<form method="post" class="app-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>
<p>No account? <a href="{% url 'signup' %}">Sign up</a></p>

{% endblock %}
